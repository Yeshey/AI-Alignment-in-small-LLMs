name: Build and Release PDF
on:
  push:
    branches:
      - main
concurrency:
  group: release-pdf
  cancel-in-progress: true
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space for Nix
        uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800 # 1 week in seconds

      - name: Build PDF with Nix
        run: |
          if nix run; then
            echo "✓ PDF successfully created without errors"
          else
            echo "⚠ Build had errors/warnings, checking if PDF was generated..."
            if [ -f main.pdf ]; then
              echo "✓ PDF was generated despite errors/warnings"
            else
              echo "✗ Build failed - no PDF generated"
              exit 1
            fi
          fi

      - name: Create new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +'%Y-%m-%d-%H%M%S')-${GITHUB_SHA:0:7}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"

          echo "Creating release $TAG..."
          gh release create "$TAG" main.pdf \
            --title "PDF Build - $COMMIT_SHORT" \
            --notes "Automated PDF build from commit $COMMIT_SHORT ($(date +'%Y-%m-%d %H:%M:%S'))"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          retention-days: 7